services:
  db:
    image: pgvector/pgvector:pg17
    # Docker her açıldığında kendiliğinden başlasın. "unless-stopped" yetmiyor: Docker Desktop
    # kapanırken konteynerleri kendisi durdurur ve unless-stopped bunları bir sonraki açılışta
    # başlatmaz. Kapatmak için: docker compose --profile telegram down (veriler volume'da kalır).
    restart: always
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-andon}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-andon}
      POSTGRES_DB: ${POSTGRES_DB:-andon}
    # "Geçen ay" gibi sorgular ay sınırını Türkiye saatine göre hesaplasın.
    command: ["postgres", "-c", "timezone=Europe/Istanbul"]
    # Yalnızca bu makineden erişilsin; varsayılan parolalı veritabanı ağa açılmasın.
    ports:
      - "127.0.0.1:${POSTGRES_PORT:-5432}:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 5s
      timeout: 3s
      retries: 10

  # Uygulama: ilk açılışta veritabanını doldurur (seed + ingest), sonra API'yi ve arayüzü sunar.
  # Yalnızca veritabanı gerekiyorsa (yerel geliştirme): docker compose up -d db
  api:
    build: .
    restart: always
    depends_on:
      db:
        condition: service_healthy
    env_file:
      - path: .env
        required: false
    environment:
      DATABASE_URL: postgresql://${POSTGRES_USER:-andon}:${POSTGRES_PASSWORD:-andon}@db:5432/${POSTGRES_DB:-andon}  # secscope: ignore SECRET-DBURL-001 (yalnızca 127.0.0.1 demo veritabanı)
    # Demo kullanıcıların parolası bilinen bir varsayılan olabilir; uygulama yalnızca bu
    # makineden erişilsin. Ağa açmak için önce DEMO_PAROLA değiştirilmeli.
    ports:
      - "127.0.0.1:${API_PORT:-8000}:8000"
    volumes:
      - model-onbellegi:/model-onbellegi

  # Telegram botu (isteğe bağlı): docker compose --profile telegram up -d
  # .env'de TELEGRAM_BOT_TOKEN gerekir. Veritabanını API servisi hazırlar; bot onu bekler.
  telegram:
    build: .
    profiles: [telegram]
    depends_on:
      api:
        condition: service_healthy
    env_file:
      - path: .env
        required: false
    environment:
      DATABASE_URL: postgresql://${POSTGRES_USER:-andon}:${POSTGRES_PASSWORD:-andon}@db:5432/${POSTGRES_DB:-andon}  # secscope: ignore SECRET-DBURL-001 (yalnızca 127.0.0.1 demo veritabanı)
    command: ["python", "-m", "scripts.telegram_bot"]
    # Bot her zaman açık kalsın: Docker açılınca kendiliğinden başlar. Çalışırken ağ ve
    # veritabanı kopmalarını kendisi yeniden dener. Açılışta Telegram'a ya da veritabanına
    # ulaşamazsa (bilgisayar internetsiz açıldı, token yok) çıkar ve Docker artan aralıklarla
    # (en fazla dakikada bir) yeniden başlatır; sebebi günlükte yazar.
    restart: always
    # İmajın sağlık denetimi API'nin portuna bakar; bot HTTP sunmaz. Bot ana döngüsünün her
    # turunda bir nabız dosyasına dokunur (en geç ~30 sn); 90 sn dokunmadıysa döngü takılmış ya da
    # Telegram'a/veritabanına ulaşamıyordur ve konteyner "unhealthy" görünür.
    healthcheck:
      test:
        - CMD
        - python
        - -c
        - "import os, sys, tempfile, time; p = os.path.join(tempfile.gettempdir(), 'hata-asistani-bot.nabiz'); sys.exit(time.time() - os.path.getmtime(p) > 90)"
      interval: 30s
      timeout: 5s
      start_period: 180s
      retries: 2
    volumes:
      - model-onbellegi:/model-onbellegi

  # Makine entegrasyonu demosu (isteğe bağlı): docker compose --profile entegrasyon up -d
  # Pres 3 hattının PLC'si gibi davranan OPC UA sunucusu ve onu dinleyip API'ye alarm gönderen
  # bağlayıcı. .env'de SIMULATOR_ANAHTARI gerekir: API açılışta "simulator" kaynağını bu
  # anahtarla kurar, bağlayıcı aynı anahtarla gönderir. Alarm vermek için:
  #   docker compose exec plc-simulatoru python -m entegrasyon.simulator alarm P3-HP A101
  plc-simulatoru:
    build:
      context: .
      dockerfile: Dockerfile.entegrasyon
    profiles: [entegrasyon]
    command: ["python", "-m", "entegrasyon.simulator", "sunucu"]
    restart: always
    # Bilgisayardaki bir OPC UA istemcisiyle (ör. UaExpert) bakılabilsin; yalnızca bu makineden.
    ports:
      - "127.0.0.1:${OPCUA_PORT:-4840}:4840"

  baglayici:
    build:
      context: .
      dockerfile: Dockerfile.entegrasyon
    profiles: [entegrasyon]
    depends_on:
      api:
        condition: service_healthy
      plc-simulatoru:
        condition: service_started
    environment:
      HATA_ASISTANI_ADRESI: http://api:8000
      OPCUA_ADRESI: opc.tcp://plc-simulatoru:4840/hata-asistani/
      # Boşsa bağlayıcı açıklayıcı bir mesajla çıkar (zorunlu değişken compose'u bütünüyle bozardı).
      ENTEGRASYON_ANAHTARI: ${SIMULATOR_ANAHTARI:-}
      KUYRUK_DOSYASI: /veri/kuyruk.sqlite
      NABIZ_DOSYASI: /tmp/baglayici.nabiz
    restart: always
    # Nabız, OPC UA bağlantısı canlıyken en geç birkaç saniyede bir güncellenir; PLC'ye
    # ulaşılamıyorsa konteyner "unhealthy" görünür.
    healthcheck:
      test:
        - CMD
        - python
        - -c
        - "import os, sys, time; sys.exit(time.time() - os.path.getmtime('/tmp/baglayici.nabiz') > 30)"
      interval: 15s
      timeout: 5s
      start_period: 30s
      retries: 2
    volumes:
      - baglayici-kuyrugu:/veri

volumes:
  pgdata:
  model-onbellegi:
  baglayici-kuyrugu:
