services:
  db:
    image: pgvector/pgvector:pg17
    # Docker açılınca (ör. bilgisayar yeniden başlayınca) kendiliğinden başlasın; elle
    # durdurulursa (docker compose stop) kapalı kalır.
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-andon}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-andon}
      POSTGRES_DB: ${POSTGRES_DB:-andon}
    # "Geçen ay" gibi sorgular ay sınırını Türkiye saatine göre hesaplasın.
    command: ["postgres", "-c", "timezone=Europe/Istanbul"]
    # Yalnızca bu makineden erişilsin; varsayılan parolalı veritabanı ağa açılmasın.
    ports:
      - "127.0.0.1:${POSTGRES_PORT:-5432}:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 5s
      timeout: 3s
      retries: 10

  # Uygulama: ilk açılışta veritabanını doldurur (seed + ingest), sonra API'yi ve arayüzü sunar.
  # Yalnızca veritabanı gerekiyorsa (yerel geliştirme): docker compose up -d db
  api:
    build: .
    restart: unless-stopped
    depends_on:
      db:
        condition: service_healthy
    env_file:
      - path: .env
        required: false
    environment:
      DATABASE_URL: postgresql://${POSTGRES_USER:-andon}:${POSTGRES_PASSWORD:-andon}@db:5432/${POSTGRES_DB:-andon}  # secscope: ignore SECRET-DBURL-001 (yalnızca 127.0.0.1 demo veritabanı)
    # Demo kullanıcıların parolası bilinen bir varsayılan olabilir; uygulama yalnızca bu
    # makineden erişilsin. Ağa açmak için önce DEMO_PAROLA değiştirilmeli.
    ports:
      - "127.0.0.1:${API_PORT:-8000}:8000"
    volumes:
      - model-onbellegi:/model-onbellegi

  # Telegram botu (isteğe bağlı): docker compose --profile telegram up -d
  # .env'de TELEGRAM_BOT_TOKEN gerekir. Veritabanını API servisi hazırlar; bot onu bekler.
  telegram:
    build: .
    profiles: [telegram]
    depends_on:
      api:
        condition: service_healthy
    env_file:
      - path: .env
        required: false
    environment:
      DATABASE_URL: postgresql://${POSTGRES_USER:-andon}:${POSTGRES_PASSWORD:-andon}@db:5432/${POSTGRES_DB:-andon}  # secscope: ignore SECRET-DBURL-001 (yalnızca 127.0.0.1 demo veritabanı)
    command: ["python", "-m", "scripts.telegram_bot"]
    # Bot her zaman açık kalsın: Docker açılınca kendiliğinden başlar. Çalışırken ağ ve
    # veritabanı kopmalarını kendisi yeniden dener. Açılışta Telegram'a ya da veritabanına
    # ulaşamazsa (bilgisayar internetsiz açıldı, token yok) çıkar ve Docker artan aralıklarla
    # (en fazla dakikada bir) yeniden başlatır; sebebi günlükte yazar.
    restart: unless-stopped
    volumes:
      - model-onbellegi:/model-onbellegi

volumes:
  pgdata:
  model-onbellegi:
