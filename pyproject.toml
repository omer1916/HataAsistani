[build-system]
requires = ["setuptools>=75"]
build-backend = "setuptools.build_meta"

[project]
name = "andon"
version = "0.1.0"
description = "Fabrika verisi ve bakım kılavuzları üzerinde çalışan yapay zekâ asistanı"
readme = "README.md"
license = "MIT"
requires-python = ">=3.12"
dependencies = [
    "faker>=30",  # seed; Docker demo'su ilk açılışta sahte veri üretir
    "fastapi>=0.115",
    "httpx>=0.27",  # Telegram Bot API istemcisi
    "openai>=1.60",  # Gemini ve Ollama'nın OpenAI uyumlu API'si için
    "psycopg[binary]>=3.2",
    "psycopg-pool>=3.2",
    "pwdlib[argon2]>=0.2",
    "pydantic-settings>=2",
    "pyjwt>=2.8",
    "pypdf>=5",
    "python-multipart",  # /giris formu (OAuth2 parola akışı) için
    "sentence-transformers>=3",
    "tzdata",  # Windows'ta zoneinfo saat dilimi verisini bu paketten okur
    "uvicorn>=0.30",
]

[project.optional-dependencies]
dev = [
    "fpdf2>=2.8",  # sahte kılavuzların PDF'lerini üretmek için
    "httpx2",  # FastAPI TestClient için
    "hypothesis>=6",  # özellik tabanlı testler
    "pytest>=8",
    "ruff>=0.6",
]

[tool.setuptools]
packages = ["app"]

[tool.ruff]
line-length = 100
target-version = "py312"
# Üçüncü taraf skill'ler değiştirilmeden kopyalandı; kendi kod stilleri var.
extend-exclude = [".claude"]

[tool.ruff.lint]
# E/F: temel hatalar, I: import sırası, B: sık yapılan hatalar, UP: modern Python yazımı
select = ["E", "F", "I", "B", "UP"]

[tool.ruff.lint.per-file-ignores]
# Tanıtım PDF'inin HTML ve CSS şablonları; satırları bölmek şablonu okunmaz yapar.
"sunum/pdf_olustur.py" = ["E501"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]  # testler scripts/ altındaki modülleri de import edebilsin
# Değerlendirme seti gerçek LLM'e istek atar (süre ve kota harcar); yalnızca `pytest -m eval`
# ile açıkça istendiğinde çalışır.
addopts = "-m 'not eval'"
markers = ["eval: gerçek LLM ile uçtan uca değerlendirme (GEMINI_API_KEY gerekir)"]
